name: Flood sources

# Looks for long river height records for gauges the flood model doesn't cover yet (.github/flood_sources.py).
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [".github/flood_sources.py"]

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install requests
      - name: Get the published site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/pages.sh get
      - name: Look
        run: python -u .github/flood_sources.py
