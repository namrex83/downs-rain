name: Flood model

# The site's own peak estimates for the Condamine's gauges, learned from past floods (.github/flood_model.py).
# Learning is run by hand every few months (and when the model's code changes); the estimates themselves are worked
# out on each radar run from the model this publishes.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [".github/flood_model.py"]

permissions:
  contents: write

concurrency:
  group: flood-model
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests

      - name: Get the published site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/pages.sh get

      - name: Restore the downloaded records
        uses: actions/cache/restore@v5
        with:
          path: fm_cache
          key: flood-records-${{ github.run_id }}
          restore-keys: flood-records-

      - name: The radar job's working state (the readings this site keeps for gauges with no government record)
        uses: actions/cache/restore@v5
        with:
          path: state
          key: radar-state-v2-${{ github.run_id }}
          restore-keys: radar-state-v2-

      - name: Learn from past floods
        run: python -u .github/flood_model.py train

      - name: Keep the downloaded records
        uses: actions/cache/save@v5
        with:
          path: fm_cache
          key: flood-records-${{ github.run_id }}

      - name: First estimates
        run: python -u .github/flood_model.py now || echo "estimates skipped"

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/pages.sh put "Flood model $(date -u +%Y-%m-%dT%H:%MZ)"
