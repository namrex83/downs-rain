name: dns-check
on:
  workflow_dispatch: {}
  push:
    paths: [".github/workflows/dns-check.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          for t in NS A AAAA CNAME TXT; do echo "== $t (Cloudflare 1.1.1.1)"; dig +short namrexweather.com $t @1.1.1.1; done
          echo "== www CNAME"; dig +short www.namrexweather.com @1.1.1.1
          echo "== A via Google 8.8.8.8"; dig +short namrexweather.com A @8.8.8.8
          echo "== whois nameservers / status"; whois namrexweather.com | grep -i -E "name server|status|expir" | head -12 || true
          echo "== https"; curl -sS -o /dev/null -w "%{http_code} %{redirect_url}\n" https://namrexweather.com/ || true
