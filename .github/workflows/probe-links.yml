name: Check outlook links (one-off test)
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Try index graph pages
        run: |
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1"
          for u in "https://www.bom.gov.au/climate/enso/indices.shtml" "https://www.bom.gov.au/climate/enso/indices.shtml?bookmark=nino34" "https://www.bom.gov.au/climate/enso/indices.shtml?bookmark=iod" \
                   "https://www.bom.gov.au/climate/enso/soi/" "https://www.bom.gov.au/climate/mjo/" \
                   "https://www.cpc.ncep.noaa.gov/products/precip/CWlink/daily_ao_index/aao/aao.shtml" "https://www.cpc.ncep.noaa.gov/products/precip/CWlink/daily_ao_index/aao/aao.obs.gif"; do
            out=$(curl -s -o /tmp/p -w "%{http_code} %{content_type}" -L --max-time 25 -A "$UA" "$u")
            title=$(grep -o '<title>[^<]*' /tmp/p | head -1 | cut -c8-100)
            imgs=$(grep -oiE 'src="[^"]*(nino|iod|dmi|aao|sam|soi)[^"]*\.(png|gif)"' /tmp/p | sort -u | head -6 | tr '\n' ' ')
            echo "$u -> $out | $title | $imgs"
          done
