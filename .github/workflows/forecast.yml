name: Rain forecast

on:
  schedule:
    - cron: "23 5,8,9,11,17,20,21,23 * * *"   # ECMWF 00z/12z are out by about 08/20 UTC, GFS runs about 5 h after 00/06/12/18 UTC; each script skips a run it already has
  workflow_dispatch: {}            # lets you press "Run workflow" by hand

permissions:
  contents: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install ecmwf-opendata eccodes numpy requests

      - name: Get ECMWF rain forecast
        run: python forecast.py

      - name: Get GFS rain forecast
        continue-on-error: true          # a problem here shouldn't stop the ECMWF maps going out
        run: python forecast_gfs.py

      - name: Get ECMWF storm ingredients
        continue-on-error: true          # a problem here shouldn't stop the rain forecast going out
        run: python storms_ecmwf.py

      - name: Get ECMWF wind
        continue-on-error: true          # a problem here shouldn't stop the rain forecast going out
        run: python wind.py

      - name: Get ECMWF temperature
        continue-on-error: true          # a problem here shouldn't stop the rain forecast going out
        run: python temp.py

      - name: Publish
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/forecast.json
          for f in data/storms_ecmwf.json data/forecast_gfs.json data/wind.json data/temp.json; do [ -f $f ] && git add $f; done
          if git diff --cached --quiet; then
            echo "Nothing new"
          else
            git commit -m "Model forecast $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep 7; done
          fi
