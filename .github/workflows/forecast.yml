name: Rain forecast

on:
  schedule:
    - cron: "23 5,8,9,11,17,20,21,23 * * *"   # ECMWF 00z/12z are out by about 08/20 UTC, GFS runs about 5 h after 00/06/12/18 UTC; each script skips a run it already has.
  workflow_dispatch: {}            # lets you press "Run workflow" by hand

permissions:
  contents: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install ecmwf-opendata eccodes numpy requests

      - name: Get the published site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/pages.sh get

      - name: Get ECMWF rain forecast
        run: python forecast.py

      - name: Get ECMWF AI (AIFS) rain forecast
        continue-on-error: true          # a problem here shouldn't stop the other maps going out
        run: python forecast.py aifs

      - name: Get GFS rain forecast
        continue-on-error: true          # a problem here shouldn't stop the ECMWF maps going out
        run: python forecast_gfs.py

      - name: Get ECMWF storm ingredients
        continue-on-error: true          # a problem here shouldn't stop the rain forecast going out
        run: python storms_ecmwf.py

      - name: Get ECMWF wind
        continue-on-error: true          # a problem here shouldn't stop the rain forecast going out
        run: python wind.py

      - name: Get ECMWF temperature
        continue-on-error: true          # a problem here shouldn't stop the rain forecast going out
        run: python temp.py

      - name: Get soil temperature
        continue-on-error: true          # a problem here shouldn't stop the rain forecast going out
        run: python soil.py

      - name: Get BOM town forecasts
        continue-on-error: true          # a problem here shouldn't stop the other maps going out
        run: python bom_fc.py

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/pages.sh put "Model forecast $(date -u +%Y-%m-%dT%H:%MZ)"
