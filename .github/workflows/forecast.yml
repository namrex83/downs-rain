name: Rain forecast

on:
  schedule:
    - cron: "23 5,8,9,11,17,20,21,23 * * *"   # ECMWF 00z/12z are out by about 08/20 UTC, GFS runs about 5 h after 00/06/12/18 UTC; each script skips a run it already has.
  workflow_dispatch: {}            # lets you press "Run workflow" by hand

permissions:
  contents: write
  actions: write   # the radar watchdog can restart the radar job
  issues: write    # and tell the owner

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Watchdog: if the radar job (which keeps itself going every ~10 minutes) has stopped, start it again and tell
      # the owner (a GitHub issue).
      - name: Check the radar job is running
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list -R "$GITHUB_REPOSITORY" --workflow radar.yml --limit 1 --json createdAt,status -q '.[0] | "\(.createdAt) \(.status)"')
          when=${last%% *}; status=${last##* }
          age=$(( ( $(date +%s) - $(date -d "${when:-1970-01-01T00:00:00Z}" +%s) ) / 60 ))
          echo "Latest radar run: $last ($age min ago)"
          if [ "$status" = "completed" ] && [ "$age" -gt 60 ]; then
            gh workflow run radar.yml -R "$GITHUB_REPOSITORY" --ref main && echo "Restarted the radar job"
            if [ -z "$(gh issue list -R "$GITHUB_REPOSITORY" --label radar-alert --state open --json number -q '.[0].number')" ]; then
              gh label create radar-alert -R "$GITHUB_REPOSITORY" --color d73a4a --description "The radar rain map has a problem" --force >/dev/null
              gh issue create -R "$GITHUB_REPOSITORY" --title "⚠️ Radar rain map problem" --label radar-alert \
                --body "The radar job hadn't run for $age minutes, so radar pictures were being missed. It has been restarted. This issue closes itself once the radar job runs cleanly again."
            fi
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install ecmwf-opendata eccodes numpy requests

      - name: Get the published site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/pages.sh get

      - name: Get ECMWF rain forecast
        run: python forecast.py

      - name: Get ECMWF AI (AIFS) rain forecast
        continue-on-error: true          # a problem here shouldn't stop the other maps going out
        run: python forecast.py aifs

      - name: Get GFS rain forecast
        continue-on-error: true          # a problem here shouldn't stop the ECMWF maps going out
        run: python forecast_gfs.py

      - name: Rain timing for all of Australia (GFS, 3-hourly)
        continue-on-error: true
        timeout-minutes: 10
        run: python -u gfs_timing.py

      - name: Get ECMWF storm ingredients
        continue-on-error: true          # a problem here shouldn't stop the rain forecast going out
        run: python storms_ecmwf.py

      - name: Get ECMWF wind
        continue-on-error: true          # a problem here shouldn't stop the rain forecast going out
        run: python wind.py

      - name: Get ECMWF temperature
        continue-on-error: true          # a problem here shouldn't stop the rain forecast going out
        run: python temp.py

      - name: Get soil temperature
        continue-on-error: true          # a problem here shouldn't stop the rain forecast going out
        run: python soil.py

      - name: Get BOM town forecasts
        continue-on-error: true          # a problem here shouldn't stop the other maps going out
        run: python bom_fc.py

      - name: The chart's models, kept on the site
        continue-on-error: true
        timeout-minutes: 8
        run: python -u om_points.py

      - name: Namrex forecast (score the models, work out their weights)
        continue-on-error: true
        timeout-minutes: 8
        run: python -u namrex.py

      - name: Google WeatherNext 3 rain map (about twice a day; last, as it's slow to fetch)
        continue-on-error: true
        timeout-minutes: 8
        run: python -u weathernext.py

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/pages.sh put "Model forecast $(date -u +%Y-%m-%dT%H:%MZ)"
