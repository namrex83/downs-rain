name: sat-probe
on:
  push:
    paths: [".github/workflows/sat-probe.yml"]
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: pip install -q numpy tifffile imagecodecs
      - run: |
          python3 - <<'P'
          from ftplib import FTP
          import numpy as np, tifffile, io
          f=FTP("ftp.bom.gov.au"); f.login(); f.cwd("/anon/gen/gms")
          names=sorted(n for n in f.nlst() if n.startswith("IDE00430"))
          pts={"Millmerran":(-27.88,151.27),"Brookstead":(-27.76,151.45),"Dalby":(-27.18,151.26),"Chinchilla":(-26.74,150.63)}
          for n in names[::6]:
            b=io.BytesIO(); f.retrbinary("RETR "+n, b.write); a=tifffile.imread(io.BytesIO(b.getvalue()))
            g=a[...,0] if a.ndim==3 else a
            row=[]
            for k,(la,lo) in pts.items():
              r=int((20-la)/0.018); c=int((lo-85)/0.018); w=g[r-3:r+4,c-3:c+4]
              row.append(f"{k} {int(w.mean())}/{int(w.max())}")
            print(n[9:21], " ".join(row), flush=True)
          P
