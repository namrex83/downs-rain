name: River gauge map

# Rough positions of the Bureau's river gauges and the creek lines they sit on (from OpenStreetMap), for the
# Catchments tab. Only needs running again when the Bureau adds gauges.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [".github/river_map.py", ".github/workflows/river-map.yml"]

permissions:
  contents: write

concurrency:
  group: river-map
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests shapely

      - name: Get the published site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/pages.sh get

      - name: Place the gauges
        run: python .github/river_map.py

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/pages.sh put "River gauge map $(date -u +%Y-%m-%dT%H:%MZ)"
