name: Storm ingredients

on:
  schedule:
    - cron: "41 4,10,16,22 * * *"   # shortly after each new GFS run reaches Open-Meteo (8:41am, 2:41pm, 8:41pm, 2:41am Qld)
  workflow_dispatch: {}              # lets you press "Run workflow" by hand

permissions:
  contents: write

concurrency:
  group: storms
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests eccodes numpy

      - name: Get the published site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/pages.sh get

      - name: Get storm forecast
        run: python storms.py

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/pages.sh put "Storm forecast $(date -u +%Y-%m-%dT%H:%MZ)"
