name: Storm ingredients

on:
  schedule:
    - cron: "41 4,10,16,22 * * *"   # shortly after each new GFS run reaches Open-Meteo (8:41am, 2:41pm, 8:41pm, 2:41am Qld)
  workflow_dispatch: {}              # lets you press "Run workflow" by hand

permissions:
  contents: write

concurrency:
  group: storms
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests

      - name: Get storm forecast
        run: python storms.py

      - name: Publish
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/storms.json
          if git diff --cached --quiet; then
            echo "Nothing new"
          else
            git commit -m "Storm forecast $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep 7; done
          fi
