name: Radar rainfall

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may run it a little late)
  workflow_dispatch: {}       # lets you press "Run workflow" by hand

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unpack program files
        run: |
          cat > radar.py <<'EOF_RADAR_PY'
          """
          Darling Downs radar rainfall.
          
          Every run (every ~10 minutes on GitHub Actions) this script:
            1. downloads new Toowoomba radar rain-rate images from the BOM public FTP,
            2. turns each image's colours into rain rates and adds them to a running
               9am-to-9am total,
            3. once a 9am day is complete, corrects the radar total against BOM rain
               gauges (and your own gauges in my_gauges.csv, if any),
            4. writes map overlays and data for the web page into data/.
          
          Working state lives in state/ (kept between runs by the GitHub Actions cache).
          """
          import datetime as dt
          import ftplib
          import io
          import json
          import math
          import os
          import re
          import sys
          
          import numpy as np
          from PIL import Image, ImageDraw
          
          # ---------------------------------------------------------------- settings
          PRODUCT = os.environ.get("RADAR_PRODUCT", "IDR1082")   # Toowoomba 256 km rain rate
          RADAR_LAT, RADAR_LON = -27.274194, 151.993111            # Toowoomba radar site
          RANGE_KM = float(os.environ.get("RADAR_RANGE_KM", "256"))  # half-width of the image
          FTP_HOST = "ftp.bom.gov.au"
          FTP_RADAR_DIR = "/anon/gen/radar"
          FTP_TRANS_DIR = "/anon/gen/radar_transparencies"
          TZ_OFFSET = dt.timedelta(hours=10)                        # Queensland, no daylight saving
          NOMINAL_STEP_MIN = 5.0     # used when there is no previous frame to measure the gap
          MAX_STEP_MIN = 15.0        # longer gaps are treated as missing data
          FINALISE_AFTER_MIN = 25    # wait this long after 9am for late frames
          
          # BOM rain-rate colours (15 levels) and an approximate rain rate for each, mm/h.
          # The gauge correction rescales the radar each day, so modest errors here wash out.
          PALETTE = [
              ((245, 245, 255), 0.5), ((180, 180, 255), 1.0), ((120, 120, 255), 2.0),
              ((20, 20, 255), 3.2), ((0, 216, 195), 5.0), ((0, 150, 144), 8.0),
              ((0, 102, 102), 12.0), ((255, 255, 0), 17.0), ((255, 200, 0), 27.0),
              ((255, 150, 0), 42.0), ((255, 100, 0), 63.0), ((255, 0, 0), 98.0),
              ((200, 0, 0), 155.0), ((120, 0, 0), 250.0), ((40, 0, 0), 360.0),
          ]
          COLOUR_TOLERANCE = 30      # max RGB distance for a pixel to count as a palette colour
          # Gauge correction
          FOCUS = (-27.18, 151.27)   # Dalby: the page reports the scale factor here
          BIAS_RADIUS_KM = 100       # gauges within about this distance set the local scale factor
          BIAS_PRIOR_MM = 10.0       # gauge rain needed before the factor moves far from 1 (stops one gauge swinging it)
          DEAD_RADAR_MM = 10.0       # a dry gauge (<1 mm) is ignored if the radar shows at least this over it...
          DEAD_RING_KM = 5.0         # ...and at least half of it nearly everywhere within this distance
          
          # BOM automatic weather stations inside the radar's range: (product, station number)
          STATIONS = [
              ("IDQ60801", "94542"),  # Dalby
              ("IDQ60801", "94552"),  # Oakey
              ("IDQ60801", "95551"),  # Toowoomba
              ("IDQ60801", "99435"),  # Wellcamp Airport
              ("IDQ60801", "94555"),  # Warwick
              ("IDQ60801", "94553"),  # Applethorpe
              ("IDQ60801", "95529"),  # Miles
              ("IDQ60801", "99468"),  # Goondiwindi
              ("IDQ60801", "95533"),  # Texas
              ("IDQ60801", "99122"),  # Inglewood (portable)
              ("IDQ60901", "94562"),  # Gatton
              ("IDQ60901", "94549"),  # Kingaroy
          ]
          USER_AGENT = "Mozilla/5.0 (compatible; downs-rain/1.0; personal rainfall map)"
          
          # Output map classes (24-hour totals, mm), coloured like the BOM radar scale.
          BREAKS = [1, 2, 4, 6, 10, 15, 20, 25, 30, 40, 50, 75, 100, 150, 200]
          RAMP = ["#f5f5ff", "#b4b4ff", "#7878ff", "#1414ff", "#00d8c3",   # BOM radar colours
                  "#009690", "#006666", "#ffff00", "#ffc800", "#ff9600",
                  "#ff6400", "#ff0000", "#c80000", "#780000", "#280000"]
          
          ROOT = os.path.dirname(os.path.abspath(__file__))
          STATE = os.path.join(ROOT, "state")
          DATA = os.path.join(ROOT, "data")
          OFFLINE = os.environ.get("OFFLINE_DIR")   # for testing without the internet
          
          
          def log(*a):
              print(*a, flush=True)
          
          
          # ---------------------------------------------------------------- time helpers
          def parse_frame_time(name):
              m = re.search(r"\.T\.(\d{12})\.png$", name)
              return dt.datetime.strptime(m.group(1), "%Y%m%d%H%M").replace(tzinfo=dt.timezone.utc) if m else None
          
          
          def window_for(t_utc):
              """Rain-day label: the local date on which the 9am-to-9am period ends."""
              local = t_utc + TZ_OFFSET
              end = local.date() if (local.hour, local.minute) <= (9, 0) else local.date() + dt.timedelta(days=1)
              return end.isoformat()
          
          
          def window_end_utc(day):
              d = dt.date.fromisoformat(day)
              return dt.datetime(d.year, d.month, d.day, 9, 0, tzinfo=dt.timezone.utc) - TZ_OFFSET
          
          
          # ---------------------------------------------------------------- downloads
          class Source:
              """BOM FTP access (or a local folder when OFFLINE_DIR is set, for testing)."""
          
              def __init__(self):
                  self.ftp = None
          
              def _conn(self):
                  if self.ftp is None:
                      self.ftp = ftplib.FTP(FTP_HOST, timeout=60)
                      self.ftp.login()
                  return self.ftp
          
              def list_frames(self):
                  if OFFLINE:
                      return sorted(f for f in os.listdir(OFFLINE) if f.startswith(PRODUCT + ".T."))
                  ftp = self._conn()
                  ftp.cwd(FTP_RADAR_DIR)
                  try:
                      names = ftp.nlst(PRODUCT + ".T.*")
                  except ftplib.error_perm:
                      names = ftp.nlst()
                  return sorted(n.split("/")[-1] for n in names if n.split("/")[-1].startswith(PRODUCT + ".T."))
          
              def get(self, folder, name):
                  if OFFLINE:
                      with open(os.path.join(OFFLINE, name), "rb") as f:
                          return f.read()
                  ftp = self._conn()
                  ftp.cwd(folder)
                  buf = io.BytesIO()
                  ftp.retrbinary("RETR " + name, buf.write)
                  return buf.getvalue()
          
              def close(self):
                  if self.ftp:
                      try:
                          self.ftp.quit()
                      except Exception:
                          pass
          
          
          # ---------------------------------------------------------------- image decoding
          _PAL_RGB = np.array([c for c, _ in PALETTE], dtype=np.int32)
          _PAL_RATE = np.array([r for _, r in PALETTE], dtype=np.float32)
          
          
          def map_offset(rgba):
              """Rows of solid title bar above the map (map area is transparent where there's no rain)."""
              h, w, _ = rgba.shape
              if h <= w:
                  return 0
              top = 0
              while top < h - w and (rgba[top, :, 3] > 200).mean() > 0.95:
                  top += 1
              return top if top else h - w
          
          
          def decode_rate(png_bytes):
              """Return (rain rate mm/h as a square float array, header offset in pixels)."""
              im = Image.open(io.BytesIO(png_bytes)).convert("RGBA")
              a = np.asarray(im)
              off = map_offset(a)
              w = a.shape[1]
              sq = a[off:off + w, :w]
              rate = np.zeros(sq.shape[:2], np.float32)
              mask = sq[..., 3] > 128
              # BOM draws solid title and time bars across the top and bottom; never count them as rain
              solid = mask.mean(axis=1) > 0.6
              t = 0
              while t < 60 and solid[t]:
                  t += 1
              b = sq.shape[0]
              while b > sq.shape[0] - 60 and solid[b - 1]:
                  b -= 1
              mask[:t] = False
              mask[b:] = False
              if mask.any():
                  px = sq[mask][:, :3].astype(np.int32)
                  d2 = ((px[:, None, :] - _PAL_RGB[None, :, :]) ** 2).sum(-1)
                  idx = d2.argmin(-1)
                  ok = d2.min(-1) <= COLOUR_TOLERANCE ** 2
                  rate[mask] = np.where(ok, _PAL_RATE[idx], 0.0)
              return rate, off
          
          
          # ---------------------------------------------------------------- geometry
          def km_per_px(n):
              return 2.0 * RANGE_KM / n
          
          
          def ll_to_px(lat, lon, n):
              """Lat/lon to radar-image pixel (column, row) using a local flat projection."""
              x = (lon - RADAR_LON) * 111.32 * math.cos(math.radians(RADAR_LAT))
              y = (lat - RADAR_LAT) * 110.57
              k = km_per_px(n)
              return n / 2 + x / k, n / 2 - y / k
          
          
          def bounds():
              dlat = RANGE_KM / 110.57
              dlon = RANGE_KM / (111.32 * math.cos(math.radians(RADAR_LAT)))
              return RADAR_LAT - dlat, RADAR_LON - dlon, RADAR_LAT + dlat, RADAR_LON + dlon
          
          
          def to_mercator(field, out_w=512):
              """Resample a radar-grid field onto a grid regular in Web Mercator (for web maps)."""
              n = field.shape[0]
              s, w, nn, e = bounds()
              merc = lambda lat: math.log(math.tan(math.pi / 4 + math.radians(lat) / 2))
              my0, my1 = merc(s), merc(nn)
              out_h = int(round(out_w * (my1 - my0) / math.radians(e - w)))
              lons = w + (np.arange(out_w) + 0.5) / out_w * (e - w)
              mys = my1 - (np.arange(out_h) + 0.5) / out_h * (my1 - my0)
              lats = np.degrees(2 * np.arctan(np.exp(mys)) - math.pi / 2)
              LON, LAT = np.meshgrid(lons, lats)
              x = (LON - RADAR_LON) * 111.32 * math.cos(math.radians(RADAR_LAT))
              y = (LAT - RADAR_LAT) * 110.57
              k = km_per_px(n)
              col = np.clip((n / 2 + x / k).astype(int), 0, n - 1)
              row = np.clip((n / 2 - y / k).astype(int), 0, n - 1)
              out = field[row, col].astype(np.float32)
              out[np.hypot(x, y) > RANGE_KM] = np.nan
              return out
          
          
          def colourise(field_m):
              h, w = field_m.shape
              rgba = np.zeros((h, w, 4), np.uint8)
              cols = [tuple(int(c[i:i + 2], 16) for i in (1, 3, 5)) for c in RAMP]
              v = np.nan_to_num(field_m, nan=-1)
              for i, b in enumerate(BREAKS):
                  m = v >= b
                  rgba[m, :3] = cols[i]
                  rgba[m, 3] = 225
              return Image.fromarray(rgba, "RGBA")
          
          
          # ---------------------------------------------------------------- state
          def load_state():
              p = os.path.join(STATE, "state.json")
              if os.path.exists(p):
                  with open(p) as f:
                      return json.load(f)
              return {"last_ts": None, "windows": {}, "done": [], "today_hour": None}
          
          
          def save_state(st):
              os.makedirs(STATE, exist_ok=True)
              with open(os.path.join(STATE, "state.json"), "w") as f:
                  json.dump(st, f, indent=1)
          
          
          def accum_path(day):
              return os.path.join(STATE, f"accum_{day}.npy")
          
          
          def load_accum(day, n):
              p = accum_path(day)
              return np.load(p) if os.path.exists(p) else np.zeros((n, n), np.float32)
          
          
          # ---------------------------------------------------------------- gauges
          def fetch_bom_gauges(day):
              """24-hour rainfall to 9am on `day` from BOM automatic stations."""
              import requests
              start = window_end_utc(day) - dt.timedelta(days=1) + TZ_OFFSET   # local 9am previous day
              end = start + dt.timedelta(days=1)
              s_key, e_key = start.strftime("%Y%m%d%H%M%S"), end.strftime("%Y%m%d%H%M%S")
              out = []
              for prod, wmo in STATIONS:
                  try:
                      if OFFLINE:
                          p = os.path.join(OFFLINE, f"{prod}.{wmo}.json")
                          if not os.path.exists(p):
                              continue
                          j = json.load(open(p))
                      else:
                          r = requests.get(f"https://www.bom.gov.au/fwo/{prod}/{prod}.{wmo}.json",
                                           headers={"User-Agent": USER_AGENT}, timeout=30)
                          r.raise_for_status()
                          j = r.json()
                      obs = j["observations"]["data"]
                      vals = []
                      for o in obs:
                          t = o.get("local_date_time_full")
                          if t and s_key < t <= e_key:
                              try:
                                  vals.append(float(o.get("rain_trace")))
                              except (TypeError, ValueError):
                                  pass
                      if not vals or not obs:
                          continue
                      out.append({"name": obs[0]["name"], "lat": obs[0]["lat"], "lon": obs[0]["lon"],
                                  "mm": round(max(vals), 1), "source": "BOM"})
                  except Exception as e:
                      log(f"  gauge {wmo}: {e}")
              return out
          
          
          def read_my_gauges(day):
              """Optional my_gauges.csv with lines: date,name,lat,lon,mm (date = the 9am reading day)."""
              p = os.path.join(ROOT, "my_gauges.csv")
              out = []
              if not os.path.exists(p):
                  return out
              for line in open(p):
                  parts = [x.strip() for x in line.split(",")]
                  if len(parts) != 5 or parts[0] != day:
                      continue
                  try:
                      out.append({"name": parts[1], "lat": float(parts[2]), "lon": float(parts[3]),
                                  "mm": float(parts[4]), "source": "mine"})
                  except ValueError:
                      pass
              return out
          
          
          def correct(radar, gauges):
              """Gauge-adjust a radar total: a scale factor that varies smoothly across the map (set
              mostly by gauges within about BIAS_RADIUS_KM), then local fixes near each gauge.
              Returns the field, the scale factor at FOCUS (Dalby), the overall factor and gauges used."""
              n = radar.shape[0]
              k = km_per_px(n)
              yy, xx = np.mgrid[0:n, 0:n]
              used = []
              for g in gauges:
                  c, r = ll_to_px(g["lat"], g["lon"], n)
                  if not (0 <= c < n and 0 <= r < n) or math.hypot(c - n / 2, r - n / 2) * k > RANGE_KM * 0.97:
                      g["radar_mm"] = None
                      continue
                  rad = max(1, int(round(1.5 / k)))   # ~3 km box around the gauge
                  box = radar[max(0, int(r) - rad):int(r) + rad + 1, max(0, int(c) - rad):int(c) + rad + 1]
                  g["radar_mm"] = round(float(box.mean()), 1)
                  # a dry gauge with solid rain over it and all around it (not just a storm edge) is
                  # probably blocked or broken, so leave it out
                  ring = max(1, int(round(DEAD_RING_KM / k)))
                  around = radar[max(0, int(r) - ring):int(r) + ring + 1, max(0, int(c) - ring):int(c) + ring + 1]
                  if (g["mm"] < 1.0 and g["radar_mm"] >= DEAD_RADAR_MM
                          and float(np.percentile(around, 10)) >= DEAD_RADAR_MM / 2):
                      g["ignored"] = "read dry under widespread rain"
                      log(f"  ignoring {g['name']}: gauge {g['mm']} mm, radar {g['radar_mm']} mm all around")
                      continue
                  g["_px"] = (c, r)
                  used.append(g)
              pairs = [g for g in used if g["mm"] >= 0.5 and g["radar_mm"] >= 0.5]
              clamp = lambda b: np.clip(b, 0.33, 3.0)
              # overall factor, pulled towards 1 when the gauges measured only a little rain
              overall = float(clamp((sum(g["mm"] for g in pairs) + BIAS_PRIOR_MM)
                                    / (sum(g["radar_mm"] for g in pairs) + BIAS_PRIOR_MM)))
              # local factor: nearby gauges count most, fading out over ~BIAS_RADIUS_KM; with no
              # gauges nearby it falls back to the overall factor
              num = np.full(radar.shape, BIAS_PRIOR_MM * overall, np.float32)
              den = np.full(radar.shape, BIAS_PRIOR_MM, np.float32)
              for g in pairs:
                  c, r = g["_px"]
                  w = np.exp(-(np.hypot(xx - c, yy - r) * k / BIAS_RADIUS_KM) ** 2)
                  num += w * g["mm"]
                  den += w * g["radar_mm"]
              scale = clamp(num / den)
              field = radar * scale
              # local residual fix, fading out over ~25 km from each gauge
              if used:
                  num = np.zeros_like(radar)
                  den = np.full_like(radar, 0.15)          # weight left with the scaled radar far from gauges
                  for g in used:
                      c, r = g["_px"]
                      d = np.hypot(xx - c, yy - r) * k
                      w = np.exp(-d / 25.0) / (1 + (d / 8.0) ** 2)
                      num += w * (g["mm"] - g["radar_mm"] * scale[int(r), int(c)])
                      den += w
                  field = np.maximum(0, field + num / den)
              for g in used:
                  c, r = g.pop("_px")
                  g["corrected_mm"] = round(float(field[int(r), int(c)]), 1)
              fc, fr = ll_to_px(*FOCUS, n)
              return field.astype(np.float32), float(scale[int(fr), int(fc)]), overall, len(pairs)
          
          
          # ---------------------------------------------------------------- outputs
          def write_outputs(day, radar, field, meta):
              os.makedirs(DATA, exist_ok=True)
              s, w, n_, e = bounds()
              corr_m = to_mercator(field)
              rad_m = to_mercator(radar)
              colourise(corr_m).save(os.path.join(DATA, f"{day}.png"), optimize=True)
              colourise(rad_m).save(os.path.join(DATA, f"{day}_radar.png"), optimize=True)
              # coarse value grid for tap-to-read on the page (tenths of mm, -1 = no data)
              enc = lambda m: np.where(np.isnan(m[::2, ::2]), -1, np.round(m[::2, ::2] * 10)).astype(int)
              vals, raw_vals = enc(corr_m), enc(rad_m)
              meta.update({"date": day, "bounds": [s, w, n_, e], "grid_w": int(vals.shape[1]),
                           "grid_h": int(vals.shape[0]), "grid": vals.flatten().tolist(),
                           "grid_raw": raw_vals.flatten().tolist()})
              with open(os.path.join(DATA, f"{day}.json"), "w") as f:
                  json.dump(meta, f, separators=(",", ":"))
              update_index(day)
              write_week(day)
          
          
          def update_index(day):
              p = os.path.join(DATA, "index.json")
              idx = json.load(open(p)) if os.path.exists(p) else {"days": []}
              if day and day not in idx["days"]:
                  idx["days"].append(day)
              idx["days"].sort()
              idx["bounds"] = list(bounds())
              idx["breaks"], idx["ramp"] = BREAKS, RAMP
              idx["radar"] = {"lat": RADAR_LAT, "lon": RADAR_LON, "range_km": RANGE_KM, "product": PRODUCT}
              idx["updated"] = dt.datetime.now(dt.timezone.utc).isoformat(timespec="minutes")
              with open(p, "w") as f:
                  json.dump(idx, f, indent=1)
          
          
          def write_week(end_day):
              """7-day totals ending on `end_day`, added up from the finished gauge-corrected days only.
              Days without a finished map are left out and listed, never filled in."""
              want = [(dt.date.fromisoformat(end_day) - dt.timedelta(days=i)).isoformat() for i in range(6, -1, -1)]
              corr = raw = None
              used, gauges = [], {}
              for day in want:
                  p = os.path.join(DATA, f"{day}.json")
                  if not os.path.exists(p):
                      continue
                  m = json.load(open(p))
                  shape = (m["grid_h"], m["grid_w"])
                  dec = lambda v: np.where(np.array(v, np.float32).reshape(shape) < 0, np.nan,
                                           np.array(v, np.float32).reshape(shape) / 10)
                  c, r = dec(m["grid"]), dec(m.get("grid_raw", m["grid"]))
                  if corr is not None and c.shape != corr.shape:
                      log(f"  week: skipping {day}, grid size changed")
                      continue
                  corr = c if corr is None else corr + c
                  raw = r if raw is None else raw + r
                  used.append(day)
                  for g in m.get("gauges", []):
                      if g.get("radar_mm") is None or g.get("ignored"):
                          continue
                      t = gauges.setdefault(g["name"], {"name": g["name"], "lat": g["lat"], "lon": g["lon"],
                                                        "source": g.get("source"), "mm": 0.0, "radar_mm": 0.0,
                                                        "corrected_mm": 0.0, "days": 0})
                      for k in ("mm", "radar_mm", "corrected_mm"):
                          t[k] = round(t[k] + (g.get(k) or 0), 1)
                      t["days"] += 1
              if corr is None:
                  return
              def up(a):   # smooth back up to the daily maps' resolution; outside the radar stays empty
                  h, w = a.shape
                  im = Image.fromarray(np.nan_to_num(a, nan=-1000).astype(np.float32), "F")
                  out = np.asarray(im.resize((w * 2, h * 2), Image.BILINEAR), np.float32)
                  return np.where(out < 0, np.nan, out)
              colourise(up(corr)).save(os.path.join(DATA, "week.png"), optimize=True)
              colourise(up(raw)).save(os.path.join(DATA, "week_radar.png"), optimize=True)
              enc = lambda a: np.where(np.isnan(a), -1, np.round(a * 10)).astype(int).flatten().tolist()
              with open(os.path.join(DATA, "week.json"), "w") as f:
                  json.dump({"days": used, "missing": [d for d in want if d not in used], "from": want[0], "to": want[-1],
                             "bounds": list(bounds()), "gauges": list(gauges.values()),
                             "grid_w": int(corr.shape[1]), "grid_h": int(corr.shape[0]),
                             "grid": enc(corr), "grid_raw": enc(raw)}, f, separators=(",", ":"))
              log(f"  7-day total {want[0]} to {want[-1]} from {len(used)} finished day(s)")
          
          
          def write_today(day, accum, info):
              os.makedirs(DATA, exist_ok=True)
              m = to_mercator(accum)
              colourise(m).save(os.path.join(DATA, "today.png"), optimize=True)
              g = m[::2, ::2]
              vals = np.where(np.isnan(g), -1, np.round(g * 10)).astype(int)
              with open(os.path.join(DATA, "today.json"), "w") as f:
                  json.dump({"date": day, "bounds": list(bounds()), **info, "grid_w": int(vals.shape[1]),
                             "grid_h": int(vals.shape[0]), "grid": vals.flatten().tolist()}, f, separators=(",", ":"))
              update_index(None)
          
          
          def write_check_image(src, sample_png, off):
              """Overlay the BOM town labels with our own computed town dots, to confirm alignment."""
              try:
                  bg = Image.open(io.BytesIO(src.get(FTP_TRANS_DIR, f"{PRODUCT}.background.png"))).convert("RGBA")
                  loc = Image.open(io.BytesIO(src.get(FTP_TRANS_DIR, f"{PRODUCT}.locations.png"))).convert("RGBA")
              except Exception as e:
                  log(f"  check image skipped: {e}")
                  return
              frame = Image.open(io.BytesIO(sample_png)).convert("RGBA")
              base = bg.copy()
              if frame.size == base.size:
                  base.alpha_composite(frame)
              if loc.size == base.size:
                  base.alpha_composite(loc)
              d = ImageDraw.Draw(base)
              n = base.size[0]
              for name, lat, lon in [("Dalby", -27.18, 151.27), ("Toowoomba", -27.56, 151.95),
                                     ("Warwick", -28.22, 152.03), ("Brisbane", -27.47, 153.03),
                                     ("Goondiwindi", -28.55, 150.31), ("Kingaroy", -26.54, 151.84)]:
                  c, r = ll_to_px(lat, lon, n)
                  r += off
                  d.ellipse([c - 4, r - 4, c + 4, r + 4], outline=(255, 0, 255, 255), width=2)
              os.makedirs(DATA, exist_ok=True)
              base.save(os.path.join(DATA, "check.png"))
              log("  wrote data/check.png (magenta circles should sit on BOM's town dots)")
          
          
          # ---------------------------------------------------------------- main run
          def run(now=None):
              now = now or dt.datetime.now(dt.timezone.utc)
              st = load_state()
              src = Source()
              try:
                  names = src.list_frames()
                  log(f"{len(names)} {PRODUCT} frames on the server")
                  last = dt.datetime.fromisoformat(st["last_ts"]) if st["last_ts"] else None
                  new = [(parse_frame_time(nm), nm) for nm in names]
                  new = sorted((t, nm) for t, nm in new if t and (last is None or t > last))
                  sample = None
                  for t, nm in new:
                      day = window_for(t)
                      if day in st["done"]:
                          continue
                      png = src.get(FTP_RADAR_DIR, nm)
                      rate, off = decode_rate(png)
                      n = rate.shape[0]
                      step = (t - last).total_seconds() / 60 if last else NOMINAL_STEP_MIN
                      win = st["windows"].setdefault(day, {"frames": 0, "minutes": 0.0, "n": n, "offset": off})
                      if step > MAX_STEP_MIN:
                          step = NOMINAL_STEP_MIN      # count this frame for its own few minutes only
                      acc = load_accum(day, n)
                      acc += rate * (step / 60.0)
                      os.makedirs(STATE, exist_ok=True)
                      np.save(accum_path(day), acc)
                      win["frames"] += 1
                      win["minutes"] = round(win["minutes"] + step, 1)
                      last = t
                      sample = png
                      log(f"  {nm}: {step:.0f} min, max rate {rate.max():.0f} mm/h")
                  if last:
                      st["last_ts"] = last.isoformat()
          
                  if sample is not None and not os.path.exists(os.path.join(DATA, "check.png")):
                      write_check_image(src, sample, st["windows"][window_for(last)]["offset"])
          
                  # finish any complete 9am days
                  for day in sorted(list(st["windows"])):
                      if now < window_end_utc(day) + dt.timedelta(minutes=FINALISE_AFTER_MIN):
                          continue
                      win = st["windows"].pop(day)
                      radar = load_accum(day, win["n"])
                      gauges = fetch_bom_gauges(day) + read_my_gauges(day)
                      field, bias, overall, npairs = correct(radar, gauges)
                      meta = {"frames": win["frames"], "coverage_pct": round(100 * win["minutes"] / 1440),
                              "bias": round(bias, 2), "bias_overall": round(overall, 2),
                              "gauges_used": npairs, "gauges": gauges}
                      write_outputs(day, radar, field, meta)
                      st["done"] = (st["done"] + [day])[-14:]
                      for f in ("today.png", "today.json"):      # the running map belongs to the day just finished
                          try:
                              os.remove(os.path.join(DATA, f))
                          except OSError:
                              pass
                      st["today_hour"] = None
                      try:
                          os.remove(accum_path(day))
                      except OSError:
                          pass
                      log(f"Finished {day}: {win['frames']} frames, {meta['coverage_pct']}% of the day, "
                          f"radar x{bias:.2f} from {npairs} gauge(s)")
          
                  # running since-9am map, refreshed about once an hour
                  cur = window_for(now)
                  if cur in st["windows"]:
                      hour_key = (now + TZ_OFFSET).strftime("%Y-%m-%dT%H")
                      if st.get("today_hour") != hour_key:
                          w = st["windows"][cur]
                          write_today(cur, load_accum(cur, w["n"]),
                                      {"frames": w["frames"], "as_of": (now + TZ_OFFSET).strftime("%H:%M")})
                          st["today_hour"] = hour_key
                          log(f"Updated today's running total ({w['frames']} frames)")
              finally:
                  src.close()
                  save_state(st)
          
          
          if __name__ == "__main__":
              run()
          EOF_RADAR_PY
          cat > index.html <<'EOF_INDEX_HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <title>Downs Radar Rain</title>
          <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
          <style>
          /* Layout: controls, a tall map, then the day's numbers — read top to bottom on a phone. */
          :root{
            --bg:#f3f4f0; --panel:#fff; --ink:#1c2621; --ink-2:#4f5b55; --ink-3:#7c8781; --line:#dde1db;
            --accent:#2f6b4f; --accent-ink:#fff; --soft:#e3eee7; --warn:#a35a00;
            --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
            --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
            --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
          }
          @media (prefers-color-scheme:dark){:root{
            --bg:#121714; --panel:#1b221e; --ink:#eef1ec; --ink-2:#b9c2bc; --ink-3:#8b958f; --line:#2c3530;
            --accent:#5fae86; --accent-ink:#0f1612; --soft:#223229; --warn:#e3a14f; color-scheme:dark}}
          *{box-sizing:border-box}
          [hidden]{display:none!important}
          body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);
            padding:calc(12px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
          .wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
          h1{font:700 1.9rem/1 var(--display);margin:0}
          h1 span{color:var(--accent)}
          .sub{margin:2px 0 0;color:var(--ink-2);font-size:.9rem}
          .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
          .field{display:flex;flex-direction:column;gap:3px}
          label,.eyebrow{font:600 .7rem/1 var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
          select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:42px}
          .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
          .seg button{font:600 .9rem var(--body);border:0;background:var(--panel);color:var(--ink-2);padding:0 12px;min-height:40px;cursor:pointer}
          .seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
          .seg button:disabled{opacity:.45}
          input[type=range]{width:110px;accent-color:var(--accent)}
          #map{height:62vh;min-height:340px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
          .legend{display:flex}
          .legend div{flex:1;min-width:0}
          .legend i{display:block;height:11px;border-right:2px solid var(--bg)}
          .legend span{font:500 .6rem var(--mono);color:var(--ink-2);white-space:nowrap}
          .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
          .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
          .stat{border-top:2px solid var(--accent);padding-top:5px;min-width:0}
          .stat b{display:block;font:600 1.45rem/1.1 var(--display);font-variant-numeric:tabular-nums}
          .stat span{font-size:.78rem;color:var(--ink-2)}
          .tap{background:var(--soft);border-radius:10px;padding:8px 12px;font-size:.92rem}
          table{width:100%;border-collapse:collapse;font-size:.88rem}
          th,td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
          td.n,th.n{text-align:right;font:500 .82rem var(--mono);font-variant-numeric:tabular-nums}
          .tablewrap{overflow-x:auto}
          .note{font-size:.8rem;color:var(--ink-3);margin:0}
          .empty{color:var(--ink-2)}
          .err{color:var(--warn)}
          .glabel{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:1px 5px;font:500 11px var(--mono);white-space:nowrap;box-shadow:none}
          .glabel::before{display:none}
          .leaflet-container{font-family:var(--body)}
          </style>
          </head>
          <body>
          <div class="wrap">
            <header>
              <h1>Downs <span>Radar Rain</span></h1>
              <p class="sub">Toowoomba radar rainfall, checked against rain gauges each morning at 9am.</p>
            </header>
          
            <div class="controls">
              <div class="field"><span class="eyebrow">View</span>
                <div class="seg"><button id="vDay" aria-pressed="true">Daily</button><button id="vWeek" aria-pressed="false">Last 7 days</button></div></div>
              <div class="field" id="dayField"><label for="day">Rain day (to 9am)</label><select id="day"></select></div>
              <div class="field"><span class="eyebrow">Show</span>
                <div class="seg"><button id="mCorr" aria-pressed="true">Gauge-corrected</button><button id="mRaw" aria-pressed="false">Radar only</button></div></div>
              <div class="field"><label for="op">See-through</label><input type="range" id="op" min="0.2" max="1" step="0.05" value="0.8"></div>
            </div>
          
            <div id="map"></div>
            <div><div class="eyebrow" style="margin-bottom:5px">Rainfall (mm)</div><div class="legend" id="legend"></div></div>
          
            <section class="panel">
              <div class="tap" id="tap">Tap the map to read the rainfall at any spot.</div>
              <div class="stats" id="stats"></div>
              <div class="tablewrap"><table id="gauges"></table></div>
              <p class="note" id="notes"></p>
            </section>
            <p class="note">Radar rain rates come from Bureau of Meteorology images, added up every few minutes. Each 9am the total is scaled to match the BOM gauges, then nudged locally near each gauge. Radar reads less reliably far from Toowoomba, behind hills and in hail. Satellite imagery © Esri and partners; street map © OpenStreetMap contributors.</p>
          </div>
          
          <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
          <script>
          (() => {
          const $ = id => document.getElementById(id);
          const bust = () => "?v=" + Date.now();
          let idx = null, meta = null, overlay = null, gaugeLayer = null, mode = "corr", view = "day";
          
          const map = L.map("map", {zoomControl: true}).setView([-27.4, 151.4], 8);
          const streets = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom: 17, attribution: "© OpenStreetMap"});
          const satellite = L.layerGroup([
            L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {maxZoom: 17, attribution: "Imagery © Esri, Maxar, Earthstar Geographics"}),
            L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}", {maxZoom: 17})
          ]);
          let base = "sat";
          try { base = localStorage.getItem("base") || "sat"; } catch(e){}
          (base === "map" ? streets : satellite).addTo(map);
          L.control.layers({"Satellite": satellite, "Map": streets}, null, {position: "topright"}).addTo(map);
          map.on("baselayerchange", e => { try { localStorage.setItem("base", e.name === "Map" ? "map" : "sat"); } catch(_){} });
          map.setMaxZoom(17);
          gaugeLayer = L.layerGroup().addTo(map);
          
          const fmt = v => v == null || isNaN(v) ? "–" : (v >= 10 ? Math.round(v) : v.toFixed(1));
          const dayMonth = d => new Date(d + "T00:00:00Z").toLocaleDateString("en-AU", {day:"numeric", month:"short", timeZone:"UTC"});
          const niceDay = d => new Date(d + "T00:00:00Z").toLocaleDateString("en-AU", {weekday:"short", day:"numeric", month:"short", timeZone:"UTC"});
          
          async function getJSON(u){ const r = await fetch(u + bust()); if(!r.ok) throw new Error(r.status); return r.json(); }
          
          function legend(){
            $("legend").innerHTML = idx.ramp.map((c,i) => `<div><i style="background:${c}"></i><span>${idx.breaks[i]}${i===idx.ramp.length-1?"+":""}</span></div>`).join("");
          }
          
          async function init(){
            try { idx = await getJSON("data/index.json"); }
            catch(e){ $("tap").innerHTML = `<span class="empty">No maps yet. The running total for today appears within the first hour of the program running, and the first finished day after the next 9am.</span>`; return; }
            legend();
            const [s,w,n,e] = idx.bounds;
            map.fitBounds([[s+1.2,w+1.6],[n-1.2,e-1.6]]);
            L.circle([idx.radar.lat, idx.radar.lon], {radius: idx.radar.range_km*1000, color:"#7c8781", weight:1, fill:false, dashArray:"4 4", interactive:false}).addTo(map);
            const sel = $("day");
            sel.innerHTML = `<option value="today">Today so far (since 9am)</option>` +
              idx.days.slice().reverse().map(d => `<option value="${d}">${niceDay(d)}</option>`).join("");
            if (idx.days.length) sel.value = idx.days[idx.days.length-1];
            sel.onchange = show; show();
          }
          
          async function show(){
            const week = view === "week";
            const day = week ? "week" : $("day").value;
            $("dayField").hidden = week;
            gaugeLayer.clearLayers(); $("stats").innerHTML = ""; $("gauges").innerHTML = ""; $("notes").textContent = "";
            try { meta = await getJSON(`data/${day}.json`); }
            catch(e){ meta = null; if(overlay) map.removeLayer(overlay); $("tap").innerHTML = `<span class="err">${week ? "The 7-day total appears after the next finished day." : "That day's map isn't available yet."}</span>`; return; }
            const today = day === "today";
            $("mRaw").disabled = today; $("mCorr").disabled = today;
            const img = today ? "data/today.png" : (mode === "raw" ? `data/${day}_radar.png` : `data/${day}.png`);
            const [s,w,n,e] = meta.bounds;
            if (overlay) map.removeLayer(overlay);
            overlay = L.imageOverlay(img + bust(), [[s,w],[n,e]], {opacity: +$("op").value, interactive:false}).addTo(map);
            $("tap").textContent = "Tap the map to read the rainfall at any spot.";
            if (today){
              $("stats").innerHTML = stat(meta.frames, "Radar scans so far") + stat(meta.as_of, "Last updated") + stat("Radar", "Not yet gauge-checked");
              $("notes").textContent = "This is the raw radar estimate since 9am. It gets checked against gauges after 9am tomorrow.";
              return;
            }
            const g = meta.gauges || [];
            if (week){
              $("stats").innerHTML = stat(`${meta.days.length} of 7`, "Finished days added") + stat(`${dayMonth(meta.from)} – ${dayMonth(meta.to)}`, "Rain days, each to 9am") + stat("Gauge-corrected", "Each day checked at 9am");
              $("notes").textContent = meta.missing.length ? `Not included (no finished map): ${meta.missing.map(niceDay).join(", ")}. Totals will read low wherever it rained on those days.` : "";
              $("gauges").innerHTML = `<thead><tr><th>Gauge</th><th class="n">Gauge</th><th class="n">Radar</th><th class="n">Map</th></tr></thead><tbody>` +
                g.slice().sort((a,b)=>b.mm-a.mm).map(x => `<tr><td>${x.name}${x.source==="mine"?" (mine)":""}${x.days<meta.days.length?` (${x.days} of ${meta.days.length} days)`:""}</td><td class="n">${fmt(x.mm)}</td><td class="n">${fmt(x.radar_mm)}</td><td class="n">${fmt(x.corrected_mm)}</td></tr>`).join("") + `</tbody>`;
              for (const x of g) gaugeMarker(x);
              return;
            }
            $("stats").innerHTML = stat(`×${meta.bias}`, "Radar scaled by, at Dalby") + stat(meta.gauges_used, "Gauges used") + stat(`${meta.coverage_pct}%`, "Of the day scanned");
            if (meta.coverage_pct < 80) $("notes").textContent = `Some radar scans were missed (${100-meta.coverage_pct}% of the day), so the radar part may read low. Gauge readings still anchor the map.`;
            $("gauges").innerHTML = `<thead><tr><th>Gauge</th><th class="n">Gauge</th><th class="n">Radar</th><th class="n">Map</th></tr></thead><tbody>` +
              g.slice().sort((a,b)=>b.mm-a.mm).map(x => `<tr><td>${x.name}${x.source==="mine"?" (mine)":""}${x.ignored?" (ignored: read dry under widespread rain)":""}</td><td class="n">${fmt(x.mm)}</td><td class="n">${x.radar_mm==null?"out of range":fmt(x.radar_mm)}</td><td class="n">${x.ignored?"–":fmt(x.corrected_mm)}</td></tr>`).join("") + `</tbody>`;
            for (const x of g) gaugeMarker(x);
          }
          const gaugeMarker = x => L.circleMarker([x.lat, x.lon], {radius:5, color:"#1c2621", weight:1.5, fillColor:"#fff", fillOpacity:1})
            .bindTooltip(`${fmt(x.mm)}`, {permanent:true, direction:"right", className:"glabel", offset:[6,0]})
            .bindPopup(`<b>${x.name}</b><br>Gauge ${fmt(x.mm)} mm<br>Radar ${x.radar_mm==null?"out of range":fmt(x.radar_mm)+" mm"}`)
            .addTo(gaugeLayer);
          const stat = (v, l) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`;
          
          function valueAt(lat, lon){
            if (!meta || !meta.grid) return null;
            const [s,w,n,e] = meta.bounds, merc = a => Math.log(Math.tan(Math.PI/4 + a*Math.PI/360));
            const fx = (lon - w)/(e - w), fy = (merc(n) - merc(lat))/(merc(n) - merc(s));
            if (fx<0||fx>=1||fy<0||fy>=1) return null;
            const grid = (mode === "raw" && meta.grid_raw) ? meta.grid_raw : meta.grid;
            const v = grid[Math.floor(fy*meta.grid_h)*meta.grid_w + Math.floor(fx*meta.grid_w)];
            return v < 0 ? null : v/10;
          }
          map.on("click", ev => {
            const v = valueAt(ev.latlng.lat, ev.latlng.lng);
            const where = `${ev.latlng.lat.toFixed(2)}°, ${ev.latlng.lng.toFixed(2)}°`;
            $("tap").innerHTML = v == null ? `No radar data at ${where}.` : `About <b>${fmt(v)} mm</b> at ${where}${view==="week"?" over the 7 days":$("day").value==="today"?" since 9am":""}${(view!=="week"&&$("day").value==="today")||mode==="raw"?" (radar only)":""}.`;
          });
          $("op").oninput = () => overlay && overlay.setOpacity(+$("op").value);
          $("mCorr").onclick = () => { mode="corr"; $("mCorr").setAttribute("aria-pressed","true"); $("mRaw").setAttribute("aria-pressed","false"); show(); };
          $("mRaw").onclick = () => { mode="raw"; $("mRaw").setAttribute("aria-pressed","true"); $("mCorr").setAttribute("aria-pressed","false"); show(); };
          const setView = v => { view = v; $("vDay").setAttribute("aria-pressed", v==="day"); $("vWeek").setAttribute("aria-pressed", v==="week"); show(); };
          $("vDay").onclick = () => setView("day");
          $("vWeek").onclick = () => setView("week");
          init();
          })();
          </script>
          </body>
          </html>
          EOF_INDEX_HTML

      - name: Install
        run: pip install numpy pillow requests

      - name: Restore working state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: radar-state-v2-${{ github.run_id }}
          restore-keys: radar-state-v2-

      - name: Process radar
        run: python radar.py

      - name: Save working state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: radar-state-v2-${{ github.run_id }}

      - name: Publish new maps
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data index.html
          if git diff --cached --quiet; then
            echo "No new maps this run"
          else
            git commit -m "Rainfall maps $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
